name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONTINUOUS_INTEGRATION_BUILD: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tfm: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer needs full history once it's wired in

      - name: Setup .NET (multi-target)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Deterministic=true

      - name: Unit tests
        run: >
          dotnet test tests/NSpark.UnitTests/NSpark.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --framework ${{ matrix.tfm }}
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tfm }}
          path: ./TestResults
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.tfm == 'net8.0'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./TestResults/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  pack:
    name: Pack (preview)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: dotnet pack src/NSpark/NSpark.csproj --configuration Release -o ./artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload nupkg
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          if-no-files-found: error
