name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Override version (e.g. 0.1.0-alpha.3)
        required: false
        type: string

permissions:
  contents: write       # create GitHub release
  id-token: write       # OIDC for trusted publishing
  attestations: write   # SLSA build provenance

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONTINUOUS_INTEGRATION_BUILD: true

jobs:
  release:
    name: Build, attest, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Deterministic=true

      - name: Unit tests
        run: >
          dotnet test tests/NSpark.UnitTests/NSpark.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/NSpark/NSpark.csproj --configuration Release --no-build --no-restore -o ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX src/NSpark/NSpark.csproj --output ./artifacts/sbom --json

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./artifacts/*.nupkg

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push './artifacts/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/sbom/**
            ./src/NSpark/runtimes/SHA256SUMS.txt
